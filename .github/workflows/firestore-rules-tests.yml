name: Firestore Rules Tests

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/**'
      - 'firebase.json'
      - 'package.json'
      - '.github/workflows/firestore-rules-tests.yml'
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'tests/**'
      - 'firebase.json'
      - 'package.json'
      - '.github/workflows/firestore-rules-tests.yml'

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install rules test tools
        run: npm install --no-save @firebase/rules-unit-testing@^4.0.1 firebase-tools@^14.0.0
      - name: Run Firestore rules tests
        run: npm run test:rules
